<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto 11 - Consentimiento de Cookies</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <!-- Contenido principal de la página -->
    <main class="contenido-principal">
        <h1>Bienvenido a mi sitio web</h1>
        <p>Este es el contenido principal de la página.</p>
    </main>

    <!-- Banner flotante de consentimiento de cookies -->
    <div id="banner-cookies" class="banner-cookies oculto">
        <div class="contenido-cookies">
            <span class="icono-cookies">🍪</span>
            <div class="texto-cookies">
                <p>Usamos cookies para mejorar tu experiencia de usuario.</p>
            </div>
            <button id="boton-aceptar" class="boton-aceptar">Me gustan las cookies</button>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
